name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    env:
      APIFY_PERSONAL_API_TOKEN: ci-placeholder
      DATABASE_URL: postgres://ci:ci@localhost:5432/limon
      BLOB_READ_WRITE_TOKEN: ci-placeholder
      AI_GATEWAY_API_KEY: ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
